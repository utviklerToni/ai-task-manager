<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep tech and AI gradient -->
    <linearGradient id="ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    
    <!-- Precision and completion gradient -->
    <linearGradient id="research-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    
    <!-- Subtle depth shadow for modern UI feel -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Dark container canvas -->
  <rect width="512" height="512" rx="110" fill="#0B0F19" />

  <!-- The Lens of Research & Discovery -->
  <circle cx="236" cy="236" r="130" fill="none" stroke="url(#ai-grad)" stroke-width="28" filter="url(#shadow)" />
  
  <!-- Lens Handle / Dynamic Forward Motion -->
  <path d="M 328 328 L 416 416" fill="none" stroke="url(#ai-grad)" stroke-width="36" stroke-linecap="round" filter="url(#shadow)" />

  <!-- Data Nodes / AI Context -->
  <circle cx="156" cy="196" r="14" fill="#14B8A6" />
  <circle cx="266" cy="146" r="18" fill="#0EA5E9" />
  <circle cx="316" cy="256" r="12" fill="#9333EA" />
  
  <!-- Network Connections -->
  <path d="M 156 196 L 266 146 L 316 256 Z" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4" stroke-dasharray="6,6" />

  <!-- The Task Completion (Checkmark) intersecting the nodes -->
  <path d="M 166 246 L 216 296 L 336 176" fill="none" stroke="url(#research-grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />
</svg>
